{% load static %}

<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js"> <!--<![endif]-->
	<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="{{ this_app.developed_by }}" />
	<!-- Place favicon.ico and apple-touch-icon.png in the root directory -->
	<link rel="shortcut icon" href="{{ this_app.app_icon.url }}">

	{% block meta_content %}
	{% endblock meta_content %}

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	
	<!-- FontAwesome 6 CDN -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<!-- Legacy CSS Stylesheets -->
	<link rel="stylesheet" href="{% static 'css/animate.css' %}">
	<link rel="stylesheet" href="{% static 'css/icomoon.css' %}">
	<link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
	<link rel="stylesheet" href="{% static 'css/style.css' %}">

	<!-- Modern Tailwind CSS CDN (Loaded AFTER Bootstrap so Tailwind takes precedence) -->
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						brand: {
							50: '#fef2f2',
							100: '#fee2e2',
							200: '#fecaca',
							500: '#ef4444',
							600: '#dc2626',
							700: '#b91c1c',
							800: '#991b1b',
							900: '#7f1d1d',
						},
						dark: {
							800: '#1e293b',
							900: '#0f172a',
							950: '#070b14',
						}
					},
					fontFamily: {
						sans: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
					}
				}
			}
		}
	</script>

	<!-- Explicit Root Font-Size and Reset Styles to override Bootstrap's 10px html root -->
	<style>
		html {
			font-size: 16px !important;
		}
		body {
			font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif !important;
			font-size: 16px !important;
			line-height: 1.6 !important;
		}
		.img-logo {
			height: 70px !important;
			max-height: 74px !important;
			width: auto !important;
		}
		a {
			text-decoration: none !important;
		}
		a:hover {
			text-decoration: none !important;
		}
		/* Pulsing glow for WhatsApp action */
		@keyframes pulse-glow {
			0%, 100% {
				box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
			}
			50% {
				box-shadow: 0 0 25px rgba(37, 211, 102, 0.7);
			}
		}
		.whatsapp-glow {
			animation: pulse-glow 2.5s infinite;
		}
		.eq-row {
			display: -webkit-box;
			display: -webkit-flex;
			display: -ms-flexbox;
			display: flex;
			flex-wrap: wrap;
		}
		.eq-row > [class*='col-'] {
			display: flex;
			flex-direction: column;
		}
		@media screen and (max-width: 768px) {
			.fh5co-cover .desc .desc2 {
				display: block;
				padding-top: 0px;
			}
			.fh5co-cover {
				background-position: 0px 0px !important;
			}
			.fh5co-cover .desc {
				margin-top: -150px !important;
			}
		}
	</style>

	<!-- Modernizr JS -->
	<script src="{% static 'js/modernizr-2.6.2.min.js' %}"></script>
	<!-- FOR IE9 below -->
	<!--[if lt IE 9]>
	<script src="js/respond.min.js"></script>
	<![endif]-->

	<!-- LocalBusiness JSON-LD Schema Markup for SEO & Rich Results -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": ["AutoRental", "TravelAgency"],
		"name": "Bobby Tour and Travels",
		"image": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/bobby-logo.png' %}",
		"url": "{{ request.scheme }}://{{ request.get_host }}/",
		"telephone": "+91-9424489377",
		"priceRange": "₹₹",
		"address": {
			"@type": "PostalAddress",
			"streetAddress": "In front of New Bus Stand, Burhar Road",
			"addressLocality": "Shahdol",
			"addressRegion": "Madhya Pradesh",
			"postalCode": "484001",
			"addressCountry": "IN"
		},
		"geo": {
			"@type": "GeoCoordinates",
			"latitude": 23.2999,
			"longitude": 81.3534
		},
		"openingHoursSpecification": [
			{
				"@type": "OpeningHoursSpecification",
				"dayOfWeek": [
					"Monday",
					"Tuesday",
					"Wednesday",
					"Thursday",
					"Friday",
					"Saturday",
					"Sunday"
				],
				"opens": "07:00",
				"closes": "22:00"
			}
		],
		"aggregateRating": {
			"@type": "AggregateRating",
			"ratingValue": "4.8",
			"bestRating": "5",
			"worstRating": "1",
			"ratingCount": "163"
		},
		"areaServed": [
			"Shahdol",
			"Anuppur",
			"Umaria",
			"Bandhavgarh",
			"Amarkantak",
			"Jabalpur",
			"Madhya Pradesh"
		]
	}
	</script>

	</head>

{% include 'navbar.html' %}
{% include 'partials/_message.html' %}

	{% block content %}
	{% endblock content %}

{% include 'footer.html' %}

<!-- Mobile Sticky Bottom Action Bar -->
<div class="fixed bottom-0 inset-x-0 z-50 sm:hidden bg-slate-950/95 backdrop-blur-md border-t border-slate-800 p-2.5 grid grid-cols-2 gap-2.5 shadow-2xl">
    <a href="tel:+919424489377" class="flex items-center justify-center gap-2 py-3 px-3 rounded-2xl font-bold text-white bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-sm shadow">
        <i class="fas fa-phone-alt text-red-500"></i>
        <span>Call Now</span>
    </a>
    <a href="https://wa.me/919424489377?text=Hello%20Bobby%20Tour%20and%20Travels,%20I%20want%20to%20book%20a%20car." target="_blank" class="whatsapp-glow flex items-center justify-center gap-2 py-3 px-3 rounded-2xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-sm shadow-lg shadow-emerald-600/30">
        <i class="fab fa-whatsapp text-lg"></i>
        <span>WhatsApp</span>
    </a>
</div>
